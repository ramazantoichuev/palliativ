services:
  web:
    image: ghcr.io/ramazantoichuev/palliativ:latest
    container_name: palliativ_web
    restart: always
    volumes:
      # Код приложения живёт в образе; наружу вынесены только статика и медиа
      - static_volume:/app/staticfiles
      - ./media:/app/media

    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: palliativ_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      - web

  db:
    image: postgres:18.4-alpine
    container_name: palliativ_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10-alpine
    container_name: palliativ_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  huey:
    image: ghcr.io/ramazantoichuev/palliativ:latest
    container_name: palliativ_huey
    volumes:
      # huey пишет в media сжатые изображения и PDF-версии Word-файлов
      - ./media:/app/media
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py run_huey
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume: