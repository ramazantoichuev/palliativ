services:
  web:
    build: .
    container_name: palliativ_web
    restart: always
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.4-alpine
    container_name: palliativ_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10-alpine
    container_name: palliativ_redis
    restart: always
    ports:
      - "6379:6379"

  huey:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      -.env
    depends_on:
      - db
      - redis
    command: python manage.py run_huey
    restart: unless-stopped


volumes:
  postgres_data: