{% if terms %}
<div class="mt-3">
    <strong>{% translate "Термины в этом материале:" %}</strong>
    <ul class="list-unstyled d-flex flex-wrap gap-2 mt-1">
        {% for term in terms %}
        <li>
            <button type="button" class="btn btn-sm btn-outline-secondary"
                    data-bs-toggle="popover" data-bs-trigger="focus"
                    data-bs-title="{{ term.name }}" data-bs-content="{{ term.definition }}">
                {{ term.name }}
            </button>
        </li>
        {% endfor %}
    </ul>
</div>
{% endif %}
