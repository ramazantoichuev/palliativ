{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <h2>{% translate "Удалить мероприятие" %}</h2>
    <p>{% translate "Вы уверены, что хотите удалить" %} «{{ object.title }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">{% translate "Удалить" %}</button>
    </form>
</div>
{% endblock %}
