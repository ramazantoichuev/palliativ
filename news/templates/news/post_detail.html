{% extends 'base.html' %}
{% load i18n %}

{% block title %}{{ post.title }} — Паллиатив.kg{% endblock %}

{% block content %}
    <p>
        <a href="{% url 'news:post_list' %}">&larr; {% translate "Все новости" %}</a>
    </p>

    <article>
        <h1 class="fw-bold">{{ post.title }}</h1>
        <p class="text-muted">{{ post.created_at }}</p>

        {% if post.image %}
            <img src="{{ post.image.url }}" class="img-fluid rounded mb-3" alt="{{ post.title }}">
        {% endif %}

        <div>
            {{ post.content|linebreaks }}
        </div>
    </article>
{% endblock %}
