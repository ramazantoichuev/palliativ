<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новости</title>
</head>
<body>

<h1>Новости</h1>

{% for post in posts %}
    <article>
        <h2>
            <a href="{% url 'news:post_detail' post.slug %}">
                {{ post.title }}
            </a>
        </h2>

        <p>{{ post.created_at }}</p>

        {% if post.image %}
            <img src="{{ post.image.url }}" alt="{{ post.title }}">
        {% endif %}
    </article>
{% empty %}
    <p>Новостей пока нет.</p>
{% endfor %}

</body>
</html>
